name: Build & Test Gitora

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    name: Test & Analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git identity for tests
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-windows:
    name: Build Windows Release & Installer
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install pillow

      - name: Generate branding icons
        run: python tools/generate_icons.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Create dist directory
        shell: bash
        run: mkdir -p dist

      - name: Compile Inno Setup Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installers/windows/gitora_setup.iss

      - name: Package Windows Standalone ZIP
        shell: bash
        run: |
          cd build/windows/x64/runner/Release
          tar -a -c -f ../../../../../dist/Gitora-Windows-x64.zip *

      - name: Publish Windows Assets to GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.0"
          name: "Gitora v1.0.0 — Official Release"
          draft: false
          prerelease: false
          files: |
            dist/Gitora-Setup-1.0.0-windows-x64.exe
            dist/Gitora-Windows-x64.zip

      - name: Upload Windows Setup Installer
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Gitora-Windows-Installer
          path: dist/Gitora-Setup-1.0.0-windows-x64.exe
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Windows Standalone Bundle
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Gitora-Windows-x64-Bundle
          path: build/windows/x64/runner/Release/
          if-no-files-found: warn
          retention-days: 3

  build-linux:
    name: Build Linux DEB & AppImage
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Build Linux Release
        run: flutter build linux --release

      - name: Package DEB
        run: |
          chmod +x linux/packaging/build_deb.sh
          ./linux/packaging/build_deb.sh

      - name: Package Standalone Tarball with Installer
        run: |
          chmod +x linux/packaging/build_tarball.sh
          ./linux/packaging/build_tarball.sh

      - name: Publish Linux Assets to GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.0"
          name: "Gitora v1.0.0 — Official Release"
          draft: false
          prerelease: false
          files: |
            dist/*.deb
            dist/Gitora-Linux-x64.tar.gz

      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Gitora-Linux-DEB
          path: dist/*.deb
          if-no-files-found: warn
          retention-days: 3

      - name: Upload Linux Standalone Bundle
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Gitora-Linux-x64-Bundle
          path: build/linux/x64/release/bundle/
          if-no-files-found: warn
          retention-days: 3

  build-macos:
    name: Build macOS Application
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate localization
        run: flutter gen-l10n

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Package macOS Application
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r -y ../../../../../dist/Gitora-macOS.zip Gitora.app

      - name: Publish macOS Assets to GitHub Release
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.0"
          name: "Gitora v1.0.0 — Official Release"
          draft: false
          prerelease: false
          files: |
            dist/Gitora-macOS.zip

      - name: Upload macOS Application
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Gitora-macOS-Bundle
          path: dist/Gitora-macOS.zip
          if-no-files-found: warn
          retention-days: 3
